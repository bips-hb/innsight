# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 1 * *"

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R-${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      TORCH_TEST: 1
      TORCH_INSTALL: 1
      TORCH_COMMIT_SHA: "none"
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      TF_USE_LEGACY_KERAS: 1
      PYTORCH_ENABLE_MPS_FALLBACK: 1

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install keras
        run: |
          keras::install_keras()
        shell: Rscript {0}

      - name: Install keras3 (with TF backend)
        run: |
          keras3::install_keras(backend = "tensorflow")
        shell: Rscript {0}

      - name: Check if torch is installed
        run: |
          library(torch)
          if (!torch_is_installed()) {
            print("Torch is not installed!")
            install_torch()
          }
          if (torch::backends_mps_is_available()) {
            print("LibTorch is built with MPS support!")
          }
          print(paste0("Default number of threads: ", torch_get_num_threads()))
          print(torch_randn(1))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'
          args: 'c("--no-multiarch", "--no-manual", "--as-cran")'
          upload-snapshots: true
